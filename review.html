<body class="review-page">
<main>
  <header class="sub-hero">
    <a href="./" class="sub-name">小春<span class="seal" aria-hidden="true">春</span></a>
    <p class="title"><span>京都・大原の山里育ちの霊視鑑定師</span></p>
  </header>

  <section class="form-card" aria-labelledby="review-title">
    <svg class="corner" viewBox="0 0 64 64" aria-hidden="true"><use href="#maple"/></svg>
    <h2 id="review-title" tabindex="-1">小春への口コミ・感想</h2>
    <p class="lead">掲載する場合はニックネームのみ表示します。<br>内容を一部省略させていただくことがあります。</p>

    <form id="review-form" novalidate>
      <div class="field">
        <label for="nickname" class="legend"><span class="num">一</span>ニックネーム</label>
        <input id="nickname" name="nickname" type="text" autocomplete="nickname" placeholder="例）はる">
      </div>

      <fieldset>
        <legend><span class="num">二</span>ご相談のジャンル<span class="required">必須</span></legend>
        <div class="choices">
          <label class="check radio"><input type="radio" name="genre" value="恋愛"><span>恋愛</span></label>
          <label class="check radio"><input type="radio" name="genre" value="人間関係"><span>人間関係</span></label>
          <label class="check radio"><input type="radio" name="genre" value="仕事"><span>仕事</span></label>
          <label class="check radio other"><input type="radio" name="genre" value="その他"><span>その他：</span><input type="text" id="genre-other" name="genreOther" aria-label="その他のジャンル"></label>
        </div>
        <p class="error" id="genre-error" aria-live="polite"></p>
      </fieldset>

      <div class="field">
        <label for="comment" class="legend"><span class="num">三</span>ご感想<span class="required">必須</span></label>
        <textarea id="comment" name="comment" rows="6" required placeholder="鑑定を受けてみて感じたこと、その後の変化など、ご自由にお書きください。"></textarea>
        <p class="error" id="comment-error" aria-live="polite"></p>
      </div>

      <fieldset>
        <legend><span class="num">四</span>サイトへの掲載について<span class="required">必須</span></legend>
        <div class="choices">
          <label class="check radio"><input type="radio" name="publish" value="掲載してよい"><span>掲載してよい</span></label>
          <label class="check radio"><input type="radio" name="publish" value="掲載しないで欲しい"><span>掲載しないで欲しい</span></label>
        </div>
        <p class="error" id="publish-error" aria-live="polite"></p>
      </fieldset>

      <button class="submit" type="submit">感想を送る</button>
      <p class="error" id="submit-error" role="alert"></p>
    </form>

    <div id="completion" role="status" tabindex="-1" hidden>
      <svg viewBox="0 0 64 64" aria-hidden="true"><use href="#maple"/></svg>
      <p>ご感想をお寄せいただき、<br>ありがとうございます。<br>ひとつひとつ、大切に読ませていただきます。</p>
      <a href="./" class="back-link">トップへ戻る</a>
    </div>
  </section>

  <footer>
    <small>© 2026 小春</small>
  </footer>
</main>
